<!DOCTYPE html>
<html>
<head>
<title>Update Laporan Sampah</title>
</head>
<body>

<h2>Update Data Laporan Sampah</h2>

<form method="post" action="update.php">

<label for="id">ID Laporan: </label>
<input type="number" name="id_Laporan" required><br><br>

<label for="lokasi">Lokasi Sektor: </label>
<input type="text" name="Lokasi_Sektor" required><br><br>

<label for="tanggal">Tanggal Kegiatan: </label>
<input type="date" name="Tanggal_Kegiatan" required><br><br>

<label for="volume">Volume Sampah: </label>
<input type="number" name="Volume_Sampah" required><br><br>

<label for="jenis">Jenis Sampah: </label>
<input type="text" name="Jenis_Sampah" required><br><br>

<label for="petugas">Petugas: </label>
<input type="text" name="Petugas" required><br><br>

<button type="submit">Update</button>

</form>

</body>
</html>
