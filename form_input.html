<!DOCTYPE html>
<html>
<head>
<title>Form Input Laporan Sampah</title>
</head>
<body>

<h2>Input Data Laporan Sampah</h2>

<form method="post" action="insert.php" enctype="multipart/form-data">

<label for="lokasi">Lokasi Sektor: </label>
<input type="text" id="lokasi" name="Lokasi_Sektor" required><br><br>

<label for="tanggal">Tanggal Kegiatan: </label>
<input type="date" id="tanggal" name="Tanggal_Kegiatan" required><br><br>

<label for="volume">Volume Sampah: </label>
<input type="number" id="volume" name="Volume_Sampah" required><br><br>

<label for="jenis">Jenis Sampah: </label>
<input type="text" id="jenis" name="Jenis_Sampah" required><br><br>

<label for="petugas">Petugas: </label>
<input type="text" id="petugas" name="Petugas" required><br><br>

<label>Upload File:</label>
<input type="file" name="fileToUpload" required><br><br>

<button type="submit">Tambah Data</button>

</form>

</body>
</html>
